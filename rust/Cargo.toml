[package]
name = "spreadsheet-ai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"
polars = { version = "0.53", features = ["lazy", "csv", "dtype-full", "strings", "temporal"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
calamine = "0.26"
rust_xlsxwriter = "0.80"

[dev-dependencies]
tempfile = "3"

[features]
default = []